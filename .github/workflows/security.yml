name: Security Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 1 * * *' # At 01:00 every day
  workflow_dispatch: # manual trigger

permissions:
  contents: read
  security-events: write

jobs:
  CodeQL:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # https://github.com/github/codeql-action/releases/tag/v4.38.1
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # https://github.com/github/codeql-action/releases/tag/v4.38.1

  npm:
    uses: ./.github/workflows/npm.yml

  npm-audit:
    runs-on: ubuntu-latest
    needs: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
      - run: npm audit --audit-level=high --omit=dev --include=prod
